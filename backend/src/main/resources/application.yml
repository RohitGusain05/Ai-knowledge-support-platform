spring:
  application:
    name: knowledge-support-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledge_support}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

processing:
  worker-delay-ms: ${PROCESSING_WORKER_DELAY_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
