services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: knowledge-support-postgres
    environment:
      POSTGRES_DB: knowledge_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_support"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: knowledge-support-redis
    ports: ["6379:6379"]

  ai-service:
    build: ./ai-service
    container_name: knowledge-support-ai
    ports: ["8000:8000"]

  backend:
    build: ./backend
    container_name: knowledge-support-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/knowledge_support
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      AI_SERVICE_URL: http://ai-service:8000
      DOCUMENT_STORAGE_PATH: /app/storage/documents
    ports: ["8080:8080"]
    volumes: ["document_storage:/app/storage/documents"]
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  postgres_data:
  document_storage:
