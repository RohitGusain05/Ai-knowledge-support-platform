services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: knowledge-support-postgres
    environment:
      POSTGRES_DB: knowledge_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_support"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: knowledge-support-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
